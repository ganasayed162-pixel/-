<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة تحكم خلود سات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0d1b2a;--ink2:#16293d;--sig:#f2b632;--bg:#eef2f6;--mut:#64748b;--ln:#e2e8f0;--ok:#16a37a;--bad:#d64545}
*{box-sizing:border-box;margin:0}[hidden]{display:none!important}
body{font-family:Cairo,Tahoma,sans-serif;background:var(--bg);color:#1a2330;line-height:1.7}
button,input,select{font:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--sig);outline-offset:2px}
#login{min-height:100vh;display:grid;place-items:center;background:var(--ink);padding:20px}
#lf{background:#fff;border-radius:14px;padding:32px;width:100%;max-width:360px;display:grid;gap:12px}
#lf h1{font-size:1.4rem}#lf h1 b{color:#c98f00}#le{color:var(--bad);font-size:.9rem;min-height:1.4em}
input,select{padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;min-width:0}
.btn{background:var(--sig);color:var(--ink);border:0;padding:10px 22px;border-radius:8px;font-weight:800}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--ink);color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.lg{font-weight:800;font-size:1.25rem;padding:0 10px 18px}.lg b{color:var(--sig)}
aside button.n{background:none;border:0;color:#b6c4d4;text-align:start;padding:11px 14px;border-radius:8px;font-weight:600}
aside button.n:hover{background:var(--ink2);color:#fff}aside button.n.on{background:var(--sig);color:var(--ink);font-weight:800}
aside .sp{flex:1}.out{background:none;border:1px solid #3b5470;color:#b6c4d4;border-radius:8px;padding:9px}
main{padding:26px 30px;min-width:0}h2{font-size:1.5rem;margin-bottom:18px}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px}
.s{background:#fff;border-radius:12px;padding:18px;border-inline-start:5px solid var(--sig)}
.s:nth-child(2){border-color:var(--ok)}.s:nth-child(3){border-color:#3b82f6}.s:nth-child(4){border-color:#8b5cf6}
.s small{color:var(--mut)}.s div{font-size:1.9rem;font-weight:800;line-height:1.3}
.box{background:#fff;border-radius:12px;padding:18px;margin-bottom:18px;overflow-x:auto}
.box h3{font-size:1.05rem;margin-bottom:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row input{flex:1;min-width:130px}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{color:var(--mut);font-weight:600;font-size:.85rem;background:#f8fafc}
th,td{text-align:start;padding:10px 12px;border-bottom:1px solid var(--ln);white-space:nowrap}tr:last-child td{border:0}
.bd{display:inline-block;padding:2px 12px;border-radius:20px;font-size:.82rem;font-weight:600}
.b0{background:#fff4d6;color:#8a6200}.b1{background:#dbeafe;color:#1e4fa8}.b2{background:#d9f5e9;color:#0c7a56}.b3{background:#fde2e2;color:#a32b2b}
.lk{color:#1e4fa8;font-weight:600;text-decoration:none}.x{background:none;border:0;color:var(--bad);font-weight:600}.sr{width:100%;max-width:420px;margin-bottom:14px;background:#fff}.em{color:var(--mut);padding:10px}
@media(max-width:820px){.shell{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:10px}.lg{width:100%;padding:0 6px 6px}aside .sp{display:none}aside button.n{padding:8px 14px}main{padding:18px 14px}}
</style></head><body>
<div id="login"><form id="lf"><h1>خلود <b>سات</b> · الإدارة</h1><input id="em" type="email" placeholder="البريد الإلكتروني" autocomplete="username" required><input id="pw" type="password" placeholder="كلمة المرور" autocomplete="current-password" required><button class="btn">دخول</button><div id="le" role="alert"></div></form></div>
<div class="shell" id="app" hidden>
<aside><div class="lg">خلود <b>سات</b></div>
<button class="n on" data-t="hm">الرئيسية</button><button class="n" data-t="rq">الطلبات</button><button class="n" data-t="pr">المنتجات</button><button class="n" data-t="sl">المبيعات</button>
<div class="sp"></div><button class="out" id="out">تسجيل الخروج</button></aside>
<main>
<section id="hm"><h2>الرئيسية</h2><div class="st" id="stt"></div><div class="box"><h3>آخر الطلبات</h3><div id="hl"></div></div></section>
<section id="rq" hidden><h2>الطلبات</h2><input class="sr" id="qr" type="search" placeholder="ابحث بالاسم أو الرقم أو الخدمة…"><div class="box" id="rl"></div></section>
<section id="pr" hidden><h2>المنتجات</h2><input class="sr" id="qp" type="search" placeholder="ابحث عن منتج…"><form class="box row" id="pf"><input id="pn" placeholder="اسم المنتج" required><input id="pc" placeholder="القسم" value="ريسيفر"><input id="pp" type="number" step="0.01" placeholder="السعر" required><input id="pi" placeholder="رابط الصورة (اختياري)"><label><input type="checkbox" id="ps" checked> متوفر</label><button class="btn">إضافة</button></form><div class="box" id="pl"></div></section>
<section id="sl" hidden><h2>المبيعات</h2><input class="sr" id="qs" type="search" placeholder="ابحث بالعميل أو الصنف…"><form class="box row" id="sf"><input id="sc" placeholder="اسم العميل"><input id="si" placeholder="الصنف / الخدمة" required><input id="sa" type="number" step="0.01" placeholder="المبلغ" required><button class="btn">تسجيل بيعة</button></form><div class="box" id="sll"></div></section>
</main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="config.js"></script>
<script>
const $=i=>document.getElementById(i),db=supabase.createClient(CFG.URL,CFG.KEY);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fd=d=>new Date(d).toLocaleString("ar-EG",{dateStyle:"short",timeStyle:"short"});
const ST=["جديد","جاري التواصل","تم التنفيذ","ملغي"],wa=p=>{p=String(p).replace(/\D/g,"");return"https://wa.me/"+(p.startsWith("0")?"20"+p.slice(1):p)};
let R=[],P=[],S=[],Q={r:"",p:"",s:""};const mt=(o,q)=>!q||Object.values(o).join(" ").toLowerCase().includes(q.trim().toLowerCase());
["r","p","s"].forEach(k=>document.getElementById("q"+k).oninput=e=>{Q[k]=e.target.value;draw()});
async function gate(){const{data:{session}}=await db.auth.getSession();$("login").hidden=!!session;$("app").hidden=!session;if(session)all()}
$("lf").onsubmit=async e=>{e.preventDefault();$("le").textContent="";const{error}=await db.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});if(error)$("le").textContent="تعذّر الدخول: "+error.message;else{$("lf").reset();gate()}};
$("out").onclick=async()=>{await db.auth.signOut();gate()};
document.querySelectorAll("aside .n").forEach(b=>b.onclick=()=>{document.querySelectorAll("aside .n").forEach(x=>x.classList.toggle("on",x==b));["hm","rq","pr","sl"].forEach(t=>$(t).hidden=t!=b.dataset.t)});
async function all(){const[a,b,c]=await Promise.all([db.from("requests").select("*").order("created_at",{ascending:false}),db.from("products").select("*").order("created_at",{ascending:false}),db.from("sales").select("*").order("created_at",{ascending:false}).limit(500)]);R=a.data||[];P=b.data||[];S=c.data||[];draw()}
const sum=a=>a.reduce((t,s)=>t+Number(s.amount),0),money=n=>n.toLocaleString("ar-EG")+" ج.م";
const bd=s=>`<span class="bd b${Math.max(0,ST.indexOf(s))}">${esc(s)}</span>`;
function rtab(list,full){return list.length?`<table><tr><th>التاريخ</th><th>الاسم</th><th>الموبايل</th><th>الخدمة</th>${full?"<th>العنوان</th><th>ملاحظات</th>":""}<th>الحالة</th>${full?"<th></th>":""}</tr>${list.map(r=>`<tr><td>${fd(r.created_at)}</td><td>${esc(r.name)}</td><td><a class="lk" href="tel:${esc(r.phone)}">${esc(r.phone)}</a> ${full?`<a class="lk" target="_blank" rel="noopener" href="${wa(r.phone)}">واتساب</a>`:""}</td><td>${esc(r.service)}</td>${full?`<td>${esc(r.address)}</td><td>${esc(r.notes)}</td>`:""}<td>${full?`<select onchange="us('${r.id}',this.value)">${ST.map(s=>`<option ${s==r.status?"selected":""}>${s}</option>`).join("")}</select>`:bd(r.status)}</td>${full?`<td><button class="x" onclick="del('requests','${r.id}')">حذف</button></td>`:""}</tr>`).join("")}</table>`:'<div class="em">لا توجد نتائج.</div>'}
function draw(){const RF=R.filter(x=>mt(x,Q.r)),PF=P.filter(x=>mt(x,Q.p)),SF=S.filter(x=>mt(x,Q.s));const t=new Date().toDateString(),m=new Date().getMonth(),y=new Date().getFullYear();
$("stt").innerHTML=`<div class="s"><small>طلبات جديدة</small><div>${R.filter(r=>r.status=="جديد").length}</div></div><div class="s"><small>مبيعات اليوم</small><div>${money(sum(S.filter(s=>new Date(s.created_at).toDateString()==t)))}</div></div><div class="s"><small>مبيعات الشهر</small><div>${money(sum(S.filter(s=>{const d=new Date(s.created_at);return d.getMonth()==m&&d.getFullYear()==y})))}</div></div><div class="s"><small>عدد المنتجات</small><div>${P.length}</div></div>`;
$("hl").innerHTML=rtab(R.slice(0,5),false);$("rl").innerHTML=rtab(RF,true);
$("pl").innerHTML=PF.length?`<table><tr><th>المنتج</th><th>القسم</th><th>السعر</th><th>متوفر</th><th></th></tr>${PF.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.category)}</td><td>${esc(p.price)} ج.م</td><td><input type="checkbox" ${p.in_stock?"checked":""} onchange="ut('${p.id}',this.checked)"></td><td><button class="x" onclick="del('products','${p.id}')">حذف</button></td></tr>`).join("")}</table>`:'<div class="em">أضف أول منتج من النموذج بالأعلى.</div>';
$("sll").innerHTML=SF.length?`<table><tr><th>التاريخ</th><th>العميل</th><th>الصنف</th><th>المبلغ</th><th></th></tr>${SF.map(s=>`<tr><td>${fd(s.created_at)}</td><td>${esc(s.customer)}</td><td>${esc(s.item)}</td><td>${esc(s.amount)} ج.م</td><td><button class="x" onclick="del('sales','${s.id}')">حذف</button></td></tr>`).join("")}</table>`:'<div class="em">لا توجد مبيعات مسجلة.</div>'}
window.us=async(id,s)=>{await db.from("requests").update({status:s}).eq("id",id);const r=R.find(x=>x.id==id);if(r)r.status=s;draw()};
window.ut=async(id,v)=>{await db.from("products").update({in_stock:v}).eq("id",id)};
window.del=async(t,id)=>{if(confirm("تأكيد الحذف؟")){await db.from(t).delete().eq("id",id);all()}};
$("pf").onsubmit=async e=>{e.preventDefault();await db.from("products").insert({name:$("pn").value,category:$("pc").value,price:$("pp").value,image_url:$("pi").value||null,in_stock:$("ps").checked});e.target.reset();$("pc").value="ريسيفر";$("ps").checked=true;all()};
$("sf").onsubmit=async e=>{e.preventDefault();await db.from("sales").insert({customer:$("sc").value,item:$("si").value,amount:$("sa").value});e.target.reset();all()};
gate();
</script></body></html>
